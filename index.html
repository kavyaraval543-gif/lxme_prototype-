<title>LXME Money Tools Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: one phone viewport (LXME-style magenta/purple app) beside a short demo rail; stacks on phones. */
:root {
  --page: #F7F2EC;      /* page ground */
  --paper: #FFFFFF;     /* app surfaces */
  --blush: #FDF1F6;     /* soft pink app background */
  --plum: #8E3A8B;      /* app bar, from LXME screenshots */
  --magenta: #C8197B;   /* primary actions */
  --magenta-soft: #FBE3EF;
  --berry: #6E1F4C;     /* headings */
  --ink: #2A2027;
  --muted: #6F6469;
  --hair: #EEE3EA;
  --teal: #2F7D74; --teal-soft: #E1F0EC;
  --amber: #8A5A00; --amber-soft: #FFF4D6;
  --coral: #B4553E; --coral-soft: #FBEDE6;
  --f-body: "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-display: "Fraunces", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--magenta); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.stage { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 40px; padding-block: 24px; padding-inline: 16px; }
.phone { width: 100%; max-width: 400px; background: var(--blush); display: flex; flex-direction: column; overflow: hidden; border-radius: 18px; border: 1px solid var(--hair); min-height: 720px; position: relative; }
@media (min-width: 900px) {
  .stage { flex-wrap: nowrap; padding-block: 32px; }
  .phone { width: 390px; height: 820px; min-height: 0; border-radius: 44px; border: 10px solid #221A1F; box-shadow: 0 30px 60px -30px rgba(110,31,76,.35); }
}
.concept { background: var(--amber-soft); color: var(--amber); font-size: 11px; font-weight: 800; letter-spacing: .05em; text-align: center; padding: 6px 10px; }
.appbar { background: var(--plum); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 10px; min-height: 56px; }
.appbar h2 { margin: 0; font-size: 17px; font-weight: 700; flex: 1; }
.icon-btn { background: rgba(255,255,255,.16); border: 0; color: #fff; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; }
.pill-btn { background: rgba(255,255,255,.16); border: 0; color: #fff; border-radius: 999px; padding: 6px 11px; font-size: 12px; font-weight: 700; }
.steps { display: flex; gap: 4px; padding: 10px 16px 0; background: var(--blush); }
.steps span { flex: 1; height: 4px; border-radius: 2px; background: #EAD7E2; }
.steps span.on { background: var(--magenta); }
.screen { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.foot { padding: 12px 16px 16px; background: var(--paper); border-top: 1px solid var(--hair); display: grid; gap: 8px; }

.card { background: var(--paper); border-radius: 16px; padding: 16px; box-shadow: 0 1px 2px rgba(110,31,76,.06); display: grid; gap: 10px; }
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.h-display { font-family: var(--f-display); font-weight: 600; color: var(--berry); font-size: 23px; line-height: 1.2; margin: 0; text-wrap: balance; }
.small { font-size: 12.5px; color: var(--muted); }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14.5px; }
.row span:first-child { color: var(--muted); }
.row span:last-child { font-weight: 700; text-align: right; }
.big { font-size: 26px; font-weight: 800; color: var(--ink); }
.bar { height: 8px; border-radius: 4px; background: #F0E2EA; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--magenta); border-radius: 4px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; padding: 4px 10px; border-radius: 999px; width: fit-content; }
.status.none { background: #F3EDF0; color: var(--muted); }
.status.ready { background: var(--teal-soft); color: var(--teal); }
.next { background: var(--magenta-soft); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.next b { color: var(--berry); }

.btn { border: 0; border-radius: 12px; padding: 14px 16px; font-weight: 800; font-size: 15.5px; width: 100%; }
.btn-primary { background: var(--magenta); color: #fff; }
.btn-primary:disabled { background: #E9B6CF; cursor: not-allowed; }
.btn-ghost { background: var(--paper); color: var(--magenta); border: 1.5px solid var(--magenta); }
.btn-link { background: none; border: 0; color: var(--magenta); font-weight: 800; padding: 4px 0; text-align: left; font-size: 14px; }

.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 700; color: var(--muted); }
.money { display: flex; align-items: center; border: 1.5px solid var(--hair); border-radius: 12px; padding: 0 14px; background: var(--paper); }
.money.err { border-color: var(--coral); }
.money span { font-size: 22px; color: var(--muted); }
.money input { border: 0; outline: 0; font: inherit; font-size: 24px; font-weight: 800; padding: 11px 8px; width: 100%; min-width: 0; background: transparent; color: var(--ink); font-variant-numeric: tabular-nums; }
.err-msg { color: var(--coral); font-size: 12.5px; font-weight: 700; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: #F3E6EE; border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; padding: 10px 0; border-radius: 9px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgba(42,32,39,.14); }
.result { background: var(--teal-soft); border-radius: 14px; padding: 14px; display: grid; gap: 4px; }
.result .daily { font-family: var(--f-display); font-weight: 600; color: var(--teal); font-size: 32px; line-height: 1.1; }
.result .daily small { font-family: var(--f-body); font-size: 15px; font-weight: 700; }
.note { background: #F6F0F3; border-radius: 12px; padding: 12px; font-size: 13px; display: grid; gap: 4px; }
.note strong { color: var(--berry); }

.opt { background: var(--paper); border: 1.5px solid var(--hair); border-radius: 16px; padding: 14px; display: grid; gap: 8px; text-align: left; width: 100%; color: var(--ink); }
.opt[aria-checked="true"] { border-color: var(--magenta); box-shadow: 0 0 0 3px var(--magenta-soft); }
.opt .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.opt .head b { font-size: 16px; }
.radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #CDB8C4; flex: none; position: relative; }
.opt[aria-checked="true"] .radio { border-color: var(--magenta); }
.opt[aria-checked="true"] .radio::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--magenta); }
.opt ul { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--ink); display: grid; gap: 3px; }
.opt.disabled { background: #F4F0F2; border-style: dashed; color: var(--muted); cursor: not-allowed; }
.tag { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; padding: 3px 8px; border-radius: 999px; background: #EDE6EA; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--hair); background: var(--paper); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; color: var(--ink); }
.chip[aria-pressed="true"] { border-color: var(--magenta); background: var(--magenta-soft); color: var(--berry); }

.tick { width: 80px; height: 80px; border-radius: 50%; background: var(--teal-soft); display: grid; place-items: center; align-self: center; }
.tick div { width: 52px; height: 52px; border-radius: 50%; background: var(--teal); color: #fff; display: grid; place-items: center; font-size: 26px; font-weight: 800; }
.center { text-align: center; }
.toast { background: var(--teal-soft); color: var(--teal); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; font-weight: 700; }
.toast.neutral { background: #F3EDF0; color: var(--ink); }
.overlay { position: absolute; inset: 0; background: rgba(42,32,39,.45); display: flex; align-items: flex-end; z-index: 5; }
.sheet { background: var(--paper); border-radius: 20px 20px 0 0; padding: 18px 16px 20px; display: grid; gap: 12px; width: 100%; }

.rail { width: 100%; max-width: 400px; display: grid; gap: 16px; }
@media (min-width: 900px) { .rail { width: 340px; max-width: none; padding-top: 10px; } }
.rail h1 { font-family: var(--f-display); font-weight: 600; color: var(--berry); font-size: 27px; line-height: 1.15; margin: 0; text-wrap: balance; }
.rail p { margin: 0; color: var(--muted); }
.rail ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.rail li button { background: none; border: 0; padding: 4px 0; display: flex; gap: 10px; align-items: center; color: var(--muted); text-align: left; width: 100%; }
.rail li button .d { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #D9C9D2; display: grid; place-items: center; font-size: 12px; font-weight: 800; flex: none; }
.rail li button.on { color: var(--berry); font-weight: 800; }
.rail li button.on .d { background: var(--magenta); border-color: var(--magenta); color: #fff; }
.rail li button:disabled { opacity: .5; cursor: not-allowed; }
.legend { font-size: 13px; color: var(--muted); display: grid; gap: 4px; border-top: 1px solid #E8DDD4; padding-top: 12px; }
@media (prefers-reduced-motion: no-preference) { .screen { animation: rise .2s ease-out both; } @keyframes rise { from { transform: translateY(6px); } to { transform: none; } } }
</style>
<style>
.quote { border-left: 3px solid var(--magenta); padding: 4px 0 4px 12px; font-style: italic; color: var(--berry); font-size: 14.5px; }
.sim { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; padding: 3px 8px; border-radius: 999px; background: var(--amber-soft); color: var(--amber); width: fit-content; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; background: none; border: 0; padding: 4px 0; width: 100%; text-align: left; color: var(--ink); }
.switch { width: 40px; height: 24px; border-radius: 12px; background: #DCCBD5; position: relative; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle[aria-checked="true"] .switch { background: var(--magenta); }
.toggle[aria-checked="true"] .switch::after { transform: translateX(16px); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; background: var(--paper); border: 1.5px solid var(--hair); border-radius: 12px; padding: 12px; text-align: left; color: var(--ink); width: 100%; }
.check .box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid #CDB8C4; flex: none; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 800; }
.check[aria-checked="true"] { border-color: var(--magenta); }
.check[aria-checked="true"] .box { background: var(--magenta); border-color: var(--magenta); }
.miles { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13.5px; }
.miles li { display: flex; justify-content: space-between; gap: 8px; }
.miles li.done { color: var(--teal); font-weight: 700; }
.text-in { border: 1.5px solid var(--hair); border-radius: 12px; padding: 11px 12px; font: inherit; font-size: 14.5px; width: 100%; background: var(--paper); color: var(--ink); }
.amt-chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.amt-chips .chip { padding: 12px 0; font-size: 15px; border-radius: 12px; }
.hero-line { font-family: var(--f-display); font-weight: 600; color: var(--teal); font-size: 30px; line-height: 1.1; }
.warn { background: var(--amber-soft); color: #5E3E00; border-radius: 12px; padding: 12px; font-size: 13px; display: grid; gap: 4px; }
.warn strong { color: var(--amber); }
</style>
<style>
.real-bar { background: #2A2027; color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-align: center; padding: 6px 10px; }
.home { flex: 1; overflow-y: auto; background: #fff; position: relative; }
.home img { display: block; width: 100%; height: auto; }
.home .shot { cursor: default; }
.navshot { display: block; width: 100%; height: auto; background: #fff; border-top: 1px solid #F1E6EC; }
.entry { margin: 4px 12px 10px; border: 2px dashed var(--magenta); border-radius: 18px; background: #FFF6FA; padding: 14px; display: grid; gap: 8px; text-align: left; width: calc(100% - 24px); color: var(--ink); }
.entry .tagrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.entry .ptag { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; color: #fff; background: var(--magenta); border-radius: 999px; padding: 3px 8px; }
.entry b { font-size: 17px; color: var(--berry); }
.entry .go { display: inline-flex; justify-content: center; background: var(--magenta); color: #fff; font-weight: 800; border-radius: 12px; padding: 11px 14px; font-size: 15px; }
.hint { position: absolute; left: 12px; right: 12px; top: 12px; background: rgba(42,32,39,.92); color: #fff; font-size: 13px; border-radius: 12px; padding: 10px 12px; z-index: 4; }
.lockhero { background: linear-gradient(180deg, #8E3A8B, #6E1F4C); color: #fff; border-radius: 18px; padding: 16px; display: grid; gap: 6px; }
.lockhero .k { font-size: 11px; font-weight: 800; letter-spacing: .08em; opacity: .85; }
.lockhero .v { font-family: var(--f-display); font-weight: 600; font-size: 26px; line-height: 1.15; }
.lockhero .s { font-size: 13.5px; opacity: .92; }
.simtag { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; padding: 4px 9px; border-radius: 999px; background: var(--amber-soft); color: var(--amber); width: fit-content; }
.list { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.list.no li::marker { content: "✕  "; color: var(--coral); font-weight: 800; }
.list.yes li::marker { content: "✓  "; color: var(--teal); font-weight: 800; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--paper); border-radius: 14px; padding: 12px; display: grid; gap: 2px; box-shadow: 0 1px 2px rgba(110,31,76,.06); }
.tile .k { font-size: 11.5px; font-weight: 800; color: var(--muted); letter-spacing: .03em; }
.tile .v { font-size: 18px; font-weight: 800; color: var(--ink); }
.tile .s { font-size: 11.5px; color: var(--muted); }
.events { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.events li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.events .dot { width: 24px; height: 24px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 800; border: 2px solid #D9C9D2; color: var(--muted); background: #fff; }
.events li.done .dot { background: var(--teal); border-color: var(--teal); color: #fff; }
.events li.sim .dot { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); }
.feas { border: 1.5px dashed #C9A54B; background: #FFFBEF; border-radius: 12px; padding: 12px; font-size: 13px; display: grid; gap: 4px; color: #4D3A10; }
.feas strong { color: var(--amber); }
.tools-wrap { background: linear-gradient(90deg, #AC2B88, #9C368C); padding: 2px 0 12px; }
.tools { margin: 0 12px; border: 2px dashed #fff; box-shadow: 0 0 0 2px var(--magenta); border-radius: 18px; background: #FFF6FA; padding: 12px; display: grid; gap: 10px; }
.tools-head { display: flex; justify-content: space-between; align-items: center; }
.ptag { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; color: #fff; background: var(--magenta); border-radius: 999px; padding: 3px 8px; }
.tools-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tool { background: #fff; border: 1.5px solid #F1D3E3; border-radius: 14px; padding: 10px 8px; display: grid; gap: 4px; justify-items: center; text-align: center; color: var(--ink); min-height: 118px; align-content: start; }
.tool .ico { width: 36px; height: 36px; border-radius: 50%; background: var(--magenta-soft); display: grid; place-items: center; font-size: 18px; }
.tool b { font-size: 13px; line-height: 1.2; color: var(--berry); }
.tool .st { font-size: 11px; line-height: 1.25; color: var(--muted); }
.ftabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: #fff; padding: 6px 8px; border-bottom: 1px solid var(--hair); }
.ftabs button { border: 0; background: transparent; border-radius: 10px; padding: 8px 2px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.ftabs button[aria-current="page"] { background: var(--magenta-soft); color: var(--magenta); }
</style>

<div id="root"></div>

const { useState } = React;
const html = htm.bind(React.createElement);

// ---------- Sample data (all illustrative; demo settings are not LXME rules) ----------
const START = Date.UTC(2026, 9, 12);            // fixed sample start date: 12 Oct 2026
const DAY = 86400000;
const WEEK = 12;                                 // recap preview week
const SPENT = 4200, BUDGET = 6000;
const MIN_AMT = 1000, MAX_AMT = 1000000;         // demo setting
const MIN_TGT = 1000, MAX_TGT = 10000000;        // demo setting
const FUND_HOLD_MONTHS = 36;                     // example fund page in LXME suggests 3+ years
const GOALS = {
  purchase: { name: "Future major purchase", target: 60000, hint: "For example, a laptop or a two-wheeler" },
  education: { name: "Education or career goal", target: 100000, hint: "For example, a course or certification" },
  other: { name: "My goal", target: 50000, hint: "Name it yourself" },
};
const PERIODS = { "6m": { label: "6 months", months: 6 }, "1y": { label: "1 year", months: 12 }, "3y": { label: "3 years", months: 36 } };
const DEFAULT_REASON = "I want this money available for my future purchase instead of spending it impulsively.";
const ILLUS = { lower: -0.05, same: 0, higher: 0.05 };   // illustration only, not a forecast

function addMonths(t, m) { const d = new Date(t); d.setUTCMonth(d.getUTCMonth() + m); return d.getTime(); }
const dfmt = (t) => new Date(t).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
const fmt = (n) => "₹" + Math.round(n).toLocaleString("en-IN");
const nfmt = (n) => n.toLocaleString("en-IN");
function periodInfo(key) { const end = addMonths(START, PERIODS[key].months); return { end, days: Math.round((end - START) / DAY) }; }
function money(raw, min, max, what) {
  if (raw.trim() === "") return "Enter " + what + ".";
  if (!/^\d+$/.test(raw)) return "Use whole rupees only (digits, no minus sign).";
  const n = Number(raw);
  if (n <= 0) return "Must be more than ₹0.";
  if (n < min) return "Enter at least " + fmt(min) + " (demo setting).";
  if (n > max) return "Enter at most " + fmt(max) + " (demo setting).";
  return "";
}

const STEPS = [["home", "LXME Home (real screen)"], ["snapshot", "Money Snapshot"], ["goal", "Choose goal"], ["amount", "Lump-sum amount"], ["period", "Commitment period"],
  ["lock", "Lock terms"], ["review", "Review & confirm"], ["confirm", "Investment + lock (simulated)"], ["dashboard", "Commitment dashboard"], ["coach", "Weekly Money Coach"]];
const FLOW = ["goal", "amount", "period", "lock", "review"];

const INITIAL = { tab: "home", cm: "overview", snapCats: false, snapStep: false, hint: false, hide: false, goal: "purchase", goalName: GOALS.purchase.name, rawTarget: String(GOALS.purchase.target),
  raw: "25000", period: "1y", reason: DEFAULT_REASON, fitAck: false, ack1: false, ack2: false, ack3: false,
  saved: null, invested: false, locked: false, week: 0, illus: null, learn: false, toast: "", relResult: "" };

function App() {
  const [s, setS] = useState(INITIAL);
  const set = (p) => setS((o) => ({ ...o, ...p }));
  const goTab = (tab, extra) => set({ tab, toast: "", relResult: "", hint: false, ...(extra || {}) });
  const goC = (cm, extra) => set({ tab: "commit", cm, toast: "", relResult: "", hint: false, ...(extra || {}) });
  const go = (v, extra) => (["home", "snapshot", "coach"].includes(v) ? goTab(v, extra) : goC(v, extra));
  const m = (n) => (s.hide ? "₹ •••••" : fmt(n));
  const amtErr = money(s.raw, MIN_AMT, MAX_AMT, "an amount to invest");
  const tgtErr = money(s.rawTarget, MIN_TGT, MAX_TGT, "a target amount");
  const nameErr = s.goalName.trim() === "" ? "Give your goal a name." : "";
  const amount = amtErr ? 0 : Number(s.raw);
  const target = tgtErr ? 0 : Number(s.rawTarget);
  const pi = periodInfo(s.period);
  const short = PERIODS[s.period].months < FUND_HOLD_MONTHS;
  const c = s.saved;
  const active = c && s.invested && s.locked;
  const elapsed = active ? Math.min(s.week * 7, c.days) : 0;
  const timePct = c ? Math.round((elapsed / c.days) * 1000) / 10 : 0;
  const goalPct = c ? Math.round((c.amount / c.target) * 1000) / 10 : 0;
  const left = BUDGET - SPENT;
  const flowIdx = FLOW.indexOf(s.cm);

  const ConceptBar = () => html`<div class="concept">PROPOSED CONCEPT · SAMPLE DATA · NO REAL TRANSACTIONS</div>`;
  const Steps = () => html`<div class="steps" aria-label=${"Step " + (flowIdx + 1) + " of 5"}>${FLOW.map((_, i) => html`<span key=${i} class=${i <= flowIdx ? "on" : ""}></span>`)}</div>`;
  const Bar = ({ title, back, right }) => html`<header class="appbar">
    ${back && html`<button class="icon-btn" aria-label="Back" onClick=${back}>‹</button>`}<h2>${title}</h2>${right}</header>`;
  const Risk = () => html`<div class="note"><span>Mutual fund investments are subject to market risks. Read all scheme-related documents carefully.</span></div>`;
  const HideBtn = () => html`<button id="hide" class="pill-btn" aria-pressed=${s.hide} onClick=${() => set({ hide: !s.hide })}>${s.hide ? "Show amounts" : "Hide amounts"}</button>`;

  // ---------- Real LXME home (screenshot) + three proposed tool tabs ----------

      <${Bar} title="Money Snapshot" back=${() => goTab("home")} right=${html`<${HideBtn} />`} />
      <div class="screen">
        <div><div class="eyebrow">Proposed · connects what LXME already tracks</div><h3 class="h-display" style=${{ marginTop: 4 }}>See your money, then take one useful step</h3></div>

          <div class="eyebrow">This week · tracked spending</div>
          <div class="row"><span>Spent</span><span class="num" id="spent">${m(SPENT)} of ${m(BUDGET)}</span></div>

          <div class="row"><span>Budget left this week</span><span class="num" id="left">${m(left)}</span></div>
          <button id="snap-cats" class="btn-link" aria-expanded=${s.snapCats} onClick=${() => set({ snapCats: !s.snapCats })}>${s.snapCats ? "Hide categories" : "See spending by category"}</button>
          ${s.snapCats ? html`<ul class="miles" id="cat-list">${CATS.map(([k, v]) => html`<li key=${k}><span>${k}</span><span class="num">${m(v)}</span></li>`)}</ul>` : ""}

          ${active ? html`<div class="bar"><i style=${{ width: Math.min(goalPct, 100) + "%" }}></i></div>

        <p class="small">Proposed tool with sample numbers. LXME already offers expense tracking, budgets, goals and investing; this view brings them together. Commitment Mode and the Weekly Coach are separate tabs.</p>
      </div>

  // ---------- Tab 2: Commitment Mode home (status or start) ----------
  function Overview() {
    return html`<${React.Fragment}>
      <${Bar} title="Commitment Mode" back=${() => goTab("home")} />
      <div class="screen">
        ${active ? html`<span class="simtag">SIMULATED LOCK — CONCEPT PROTOTYPE</span>
            <div class="lockhero"><span class="k">🔒 YOUR COMMITMENT</span><span class="v" id="ov-status">Active · ${fmt(c.amount)}</span><span class="s num">${c.goalName} · unlocks ${dfmt(c.end)}</span></div>
            <button id="ov-dash" class="btn btn-primary" onClick=${() => goC("dashboard")}>View my commitment</button>`
          : c ? html`<div class="card"><div class="eyebrow">Your commitment</div><b id="ov-status">Saved · not yet invested or locked</b>
              <span class="small num">${fmt(c.amount)} · ${c.goalName} · unlocks ${dfmt(c.end)}</span></div>
            <button id="ov-continue" class="btn btn-primary" onClick=${() => goC("confirm")}>Continue</button>`
          : html`<div><div class="eyebrow">Proposed feature</div><h3 class="h-display" style=${{ marginTop: 4 }}>Invest a lump sum. Lock it for your goal.</h3></div>
            <div class="card">
              <ul class="list yes"><li>Pick a goal and a one-time amount</li><li>Choose how long to lock it: 6 months, 1 year or 3 years</li><li>Review the lock terms and risks before you confirm</li></ul>
            </div>
            <div class="note"><strong>Locking doesn't create returns.</strong><span>The value can go up or down. The lock only stops you withdrawing early. In this prototype, the lock is simulated.</span></div>

      <div class="foot"><button id="ov-start" class=${"btn " + (c ? "btn-ghost" : "btn-primary")} onClick=${() => goC("goal")}>${c ? "Start another plan" : "Start a commitment"}</button></div>
    <//>`;
  }

  // ---------- 3. Choose goal ----------
  function Goal() {
    const pick = (k) => set({ goal: k, goalName: GOALS[k].name, rawTarget: String(GOALS[k].target) });
    return html`<${React.Fragment}>
      <${Bar} title="Commitment Mode" back=${() => go("overview")} />
      <${Steps} />
      <div class="screen">
        <div><div class="eyebrow">Step 1 of 5 · Your goal</div><h3 class="h-display" style=${{ marginTop: 4 }}>Invest a lump sum. Lock it for your goal.</h3></div>
        <div role="radiogroup" aria-label="Goal" style=${{ display: "grid", gap: 10 }}>
          ${Object.entries(GOALS).map(([k, g]) => html`<button key=${k} id=${"g-" + k} class="opt" role="radio" aria-checked=${s.goal === k} onClick=${() => pick(k)}>
            <div class="head"><b>${k === "other" ? "Another personal goal" : g.name}</b><span class="radio"></span></div>
            <span class="small">${g.hint}</span>
          </button>`)}
        </div>
        <div class="field">
          <label for="goal-name">Goal name</label>
          <input id="goal-name" class="text-in" maxlength="40" value=${s.goalName} onInput=${(e) => set({ goalName: e.target.value })} />
          ${nameErr ? html`<div class="err-msg" role="alert">${nameErr}</div>` : ""}
        </div>
        <div class="field">
          <label for="target">Target amount</label>
          <div class=${"money" + (tgtErr ? " err" : "")}><span>₹</span>
            <input id="target" inputmode="numeric" autocomplete="off" value=${s.rawTarget} aria-invalid=${!!tgtErr} onInput=${(e) => set({ rawTarget: e.target.value.replace(/[,\s]/g, "") })} /></div>
          ${tgtErr ? html`<div id="target-help" class="err-msg" role="alert">${tgtErr}</div>` : html`<div id="target-help" class="small num">${fmt(target)}</div>`}
        </div>
        <p class="small">Emergency savings are not offered here, because they should stay easy to reach.</p>
      </div>
      <div class="foot"><button id="to-amount" class="btn btn-primary" disabled=${!!(tgtErr || nameErr)} onClick=${() => go("amount")}>Choose amount</button></div>
    <//>`;
  }

  // ---------- 4. Lump-sum amount ----------
  function Amount() {
    const pct = amount && target ? Math.round((amount / target) * 1000) / 10 : 0;
    return html`<${React.Fragment}>
      <${Bar} title="Commitment Mode" back=${() => go("goal")} />
      <${Steps} />
      <div class="screen">
        <div><div class="eyebrow">Step 2 of 5 · One-time amount</div><h3 class="h-display" style=${{ marginTop: 4 }}>How much do you want to commit upfront?</h3></div>
        <div class="amt-chips" role="group" aria-label="Quick amounts">
          ${[10000, 25000, 50000].map((v) => html`<button key=${v} id=${"a" + v} class="chip num" aria-pressed=${s.raw === String(v)} onClick=${() => set({ raw: String(v) })}>${fmt(v)}</button>`)}
        </div>
        <div class="field">
          <label for="amount">Or enter your own amount</label>
          <div class=${"money" + (amtErr ? " err" : "")}><span>₹</span>
            <input id="amount" inputmode="numeric" autocomplete="off" value=${s.raw} aria-invalid=${!!amtErr} aria-describedby="amount-help"
              onInput=${(e) => set({ raw: e.target.value.replace(/[,\s]/g, "") })} /></div>
          ${amtErr ? html`<div id="amount-help" class="err-msg" role="alert">${amtErr}</div>` : html`<div id="amount-help" class="small num">${fmt(amount)} · one-time investment</div>`}
        </div>
        ${!amtErr && html`<div class="result" aria-live="polite">
            <span class="small">Committed toward “${s.goalName}”</span>
            <div class="hero-line num" id="goal-share">${pct}% <small style=${{ fontFamily: "var(--f-body)", fontSize: 15, fontWeight: 700 }}>of ${fmt(target)}</small></div>
            <span class="small">Share of your target by amount invested. Not a projected value.</span>
          </div>
          ${amount > target ? html`<div class="note" id="over-target"><span>This is more than your target. That's allowed; you can lower it.</span></div>` : ""}`}
        <div class="note"><strong>Only lock money you won't need before the unlock date.</strong><span>Keep everyday money and emergency savings outside this commitment. You have ${fmt(left)} of budget left this week.</span></div>
        <p class="small">One-time (lump-sum) investment, not a daily or monthly plan. The ${fmt(MIN_AMT)}–${fmt(MAX_AMT)} range is a demo setting, not an LXME rule.</p>
      </div>
      <div class="foot"><button id="to-period" class="btn btn-primary" disabled=${!!amtErr} onClick=${() => go("period")}>Choose commitment period</button></div>
    <//>`;
  }

  // ---------- 5. Commitment & locking period ----------
  function Period() {
    const canGo = !short || s.fitAck;
    return html`<${React.Fragment}>
      <${Bar} title="Commitment Mode" back=${() => go("amount")} />
      <${Steps} />
      <div class="screen">
        <div><div class="eyebrow">Step 3 of 5 · Lock period</div><h3 class="h-display" style=${{ marginTop: 4 }}>How long do you want to lock this money?</h3></div>
        <div class="seg" role="group" aria-label="Lock period">
          ${Object.entries(PERIODS).map(([k, p]) => html`<button key=${k} id=${"p" + k} aria-pressed=${s.period === k} onClick=${() => set({ period: k, fitAck: false })}>${p.label}</button>`)}
        </div>
        <div class="card">
          <div class="row"><span>Investment starts</span><span class="num">${dfmt(START)} (sample date)</span></div>
          <div class="row"><span>Lock period</span><span>${PERIODS[s.period].label}</span></div>
          <div class="row"><span>Unlock date</span><span class="num" id="end-date">${dfmt(pi.end)}</span></div>
          <div class="row"><span>Days locked</span><span class="num" id="days">${nfmt(pi.days)} days</span></div>
        </div>
        ${short ? html`<div class="warn" id="fit-note"><strong>Review suitability before you continue</strong>
            <span>The example fund in LXME suggests holding for 3+ years. Your lock period is ${PERIODS[s.period].label}. Its value could be lower on your unlock date. Check that this product suits your timeline, or choose 3 years.</span>
            <button id="fit-ack" class="check" role="checkbox" aria-checked=${s.fitAck} onClick=${() => set({ fitAck: !s.fitAck })} style=${{ marginTop: 6 }}><span class="box">${s.fitAck ? "✓" : ""}</span><span>I've reviewed whether this product suits a ${PERIODS[s.period].label} goal.</span></button>
          </div>` : html`<div class="note" id="fit-ok"><span>Your lock period matches the example fund's suggested 3+ year holding period. That is not a promise of returns.</span></div>`}
        <div class="field">
          <label for="reason">Why are you committing this money? (shown back to you later)</label>
          <textarea id="reason" class="text-in" rows="3" maxlength="120" onInput=${(e) => set({ reason: e.target.value })} value=${s.reason}></textarea>
        </div>
      </div>
      <div class="foot"><button id="to-lock" class="btn btn-primary" disabled=${!canGo} onClick=${() => go("lock")}>Review lock terms</button></div>
    <//>`;
  }

  // ---------- 6. Lock-backed commitment terms ----------
  function Lock() {
    const all = s.ack1 && s.ack2 && s.ack3;
    const Ack = ({ id, k, children }) => html`<button id=${id} class="check" role="checkbox" aria-checked=${s[k]} onClick=${() => set({ [k]: !s[k] })}><span class="box">${s[k] ? "✓" : ""}</span><span>${children}</span></button>`;
    return html`<${React.Fragment}>
      <${Bar} title="Lock terms" back=${() => go("period")} />
      <${Steps} />
      <div class="screen">
        <div class="eyebrow">Step 4 of 5 · Opt in to the lock</div>
        <div class="lockhero">
          <span class="k">🔒 YOU CHOOSE TO LOCK</span>
          <span class="v num" id="lock-amount">${fmt(amount)} until ${dfmt(pi.end)}</span>
          <span class="s">For “${s.goalName}” · starts ${dfmt(START)} · ${nfmt(pi.days)} days</span>
        </div>
        <div class="card">
          <div class="eyebrow">Investment product</div>
          <span style=${{ fontSize: 14 }}>Chosen in a lock-eligible product step (proposed). Example used in this demo: an equity multi-cap fund from LXME's catalogue, suggested holding period 3+ years.</span>
        </div>
        <div class="card">
          <div class="eyebrow">Until the unlock date, you won't be able to</div>
          <ul class="list no"><li>Withdraw or redeem this amount</li><li>Move it to spending or UPI</li><li>Bring the unlock date forward</li></ul>
          <div class="eyebrow" style=${{ marginTop: 4 }}>You can still</div>
          <ul class="list yes"><li>See your investment and its value</li><li>Extend the unlock date</li><li>Request early release, but only under exceptions the product actually supports</li></ul>
        </div>
        <div class="card">
          <div class="eyebrow">Risks, charges and limits</div>
          <span style=${{ fontSize: 14 }}>Locking does not create returns. The value can fall while locked, and you can't sell to limit a loss. You get the value on the day it unlocks, which may be less than you invested. An exit load or tax may apply; check the scheme documents.</span>
        </div>
        <div class="feas"><strong>Proposed capability · simulated in this prototype</strong>
          <span>A screen alone can't restrict a mutual fund. A real lock needs an eligible product, a partner integration, regulatory review, and defined emergency exceptions. None of these is verified yet.</span></div>
        <${Ack} id="ack1" k="ack1">I can't withdraw this money until ${dfmt(pi.end)}, except under supported exceptions.<//>
        <${Ack} id="ack2" k="ack2">The value can go down while it is locked. Returns are not guaranteed.<//>
        <${Ack} id="ack3" k="ack3">In this prototype, the lock and the investment are simulated.<//>
      </div>
      <div class="foot"><button id="to-review" class="btn btn-primary" disabled=${!all} onClick=${() => go("review")}>Continue to review</button></div>
    <//>`;
  }

          <div class="row"><span>Commitment</span><span>${PERIODS[s.period].label}</span></div>

        ${!s.week ? html`<button id="ff" class="btn btn-primary" onClick=${() => set({ week: WEEK, toast: "" })}>Fast-forward to week ${WEEK} (demo)</button>`
          : html`<button id="to-coach2" class="btn btn-primary" onClick=${() => go("coach")}>Open Week ${WEEK} recap</button>`}
        <button class="btn btn-ghost" onClick=${() => go("home")}>Back to LXME Home</button>
      </div>
    <//>`;
  }

  // ---------- Early-withdrawal (release) review ----------
  function Release() {
    return html`<${React.Fragment}>
      <${Bar} title="Withdraw early?" back=${() => go("dashboard")} />
      <div class="screen">
        <span class="simtag">PROTOTYPE BEHAVIOUR · NOTHING IS PROCESSED</span>
        <div><h3 class="h-display">This money is locked until ${dfmt(c.end)}</h3>
          <p class="small" style=${{ marginTop: 6 }}>You chose to lock it for “${c.goalName}”.</p></div>
        <div class="quote">“${c.reason || "No reason added"}”</div>
        <div class="card">
          <div class="eyebrow">What the lock means</div>
          <span style=${{ fontSize: 14 }}>Normal withdrawals are switched off until the unlock date, which is ${nfmt(c.days - elapsed)} days away.</span>
          <div class="eyebrow" style=${{ marginTop: 4 }}>Proposed release rule</div>
          <span style=${{ fontSize: 14 }}>You can ask for early release under exceptions the product and partner support. The release would follow the product's real redemption rules: you get the value on that day, and an exit load or tax may apply.</span>
        </div>
        <div class="feas"><strong>Feasibility item</strong><span>Which exceptions are allowed, and how fast a release happens, depend on the eligible product and partner. Not verified yet.</span></div>
        ${s.relResult ? html`<div class="toast neutral" id="rel-result">${s.relResult}</div>` : ""}
      </div>
      <div class="foot">
        <button id="keep" class="btn btn-primary" onClick=${() => go("dashboard", { toast: "You kept your commitment. Nothing changed." })}>Keep my commitment</button>
        <button id="request" class="btn btn-ghost" onClick=${() => set({ relResult: "In the live product, this would start an early-release request under the supported rules. Nothing is processed in this prototype. (Simulated)" })}>Request early release</button>
      </div>
    <//>`;
  }

  // ---------- Tab 3: Weekly Money Coach (works with or without a commitment) ----------
  function Coach() {
    const Learn = () => html`<button id="coach-learn" class="btn btn-ghost" aria-expanded=${s.learn} onClick=${() => set({ learn: !s.learn })}>Learn why investment values fluctuate</button>
      ${s.learn ? html`<div class="note" id="learn-card"><strong>A 30-second read</strong><span>Fund values follow the prices of what the fund holds, and those change every day. Short-term ups and downs are normal. That is one reason funds suggest a holding period. It is not a promise that values will rise.</span></div>` : ""}`;
    return html`<${React.Fragment}>
      <${Bar} title="Weekly Money Coach" back=${() => goTab("home")} right=${html`<${HideBtn} />`} />
      <div class="screen">
        ${active ? html`
          <div><div class="eyebrow">${s.week ? "Week " + WEEK + " recap" : "This week"} · proposed</div><h3 class="h-display" style=${{ marginTop: 4 }} id="coach-title">You committed this money to your future goal</h3>
            <p style=${{ margin: "6px 0 0" }}>You're making progress by staying focused on your plan.</p></div>
          <div class="card">
            <div class="row"><span>Lump sum invested</span><span class="num" id="coach-amount">${m(c.amount)}</span></div>
            <div class="row"><span>Started</span><span class="num">${dfmt(START)}</span></div>
            <div class="row"><span>Unlocks</span><span class="num">${dfmt(c.end)}</span></div>
            <div class="row"><span>Time</span><span class="num" id="coach-time">${nfmt(elapsed)} days in · ${nfmt(c.days - elapsed)} to go</span></div>
            <div class="bar"><i style=${{ width: Math.max(timePct, 1.5) + "%" }}></i></div>
            <div class="row"><span>Current value</span><span id="coach-value">Not shown in prototype</span></div>
            <span class="small">In the live product, this would come from real portfolio data.</span>
            ${!s.week ? html`<button id="coach-ff" class="btn-link" onClick=${() => set({ week: WEEK })}>Fast-forward to week ${WEEK} (demo)</button>` : ""}
          </div>
          <div class="card"><div class="eyebrow">Remember why</div><div class="quote">“${c.reason || c.goalName}”</div></div>`
        : html`
          <div><div class="eyebrow">This week · general recap</div><h3 class="h-display" style=${{ marginTop: 4 }} id="coach-title">Your week in money</h3>
            <p style=${{ margin: "6px 0 0" }}>A short look back. No commitment needed.</p></div>
          <div class="card" id="coach-general">
            <div class="row"><span>Spent this week</span><span class="num" id="coach-spent">${m(SPENT)} of ${m(BUDGET)}</span></div>
            <div class="row"><span>Biggest category</span><span class="num">Food & dining · ${m(1600)}</span></div>
            <div class="row"><span>Goal</span><span>${s.goalName.trim() || GOALS[s.goal].name}</span></div>
            <span class="small">${c ? "You saved a commitment but haven't invested yet." : "No commitment yet. That's fine; this recap still works."}</span>
          </div>`}
        <div class="card"><div class="row"><span>Spending this week</span><span class="num" id="coach-left">${m(left)} of budget left</span></div></div>
        <div class="next">
          <span class="eyebrow" style=${{ color: "var(--magenta)" }}>One optional action</span>
          ${active ? html`<button id="coach-review" class="btn btn-ghost" onClick=${() => goC("dashboard")}>Review my commitment and goal progress</button>`
            : html`<button id="coach-cats" class="btn btn-ghost" onClick=${() => { set({ snapCats: true }); goTab("snapshot"); }}>Review spending by category</button>`}
          <${Learn} />
        </div>
        <p class="small">Proposed tool. It could use LXME's existing AI companion if feasible; that integration does not exist yet.</p>
      </div>
      <div class="foot"><button id="back-home" class="btn btn-primary" onClick=${() => goTab("home")}>Back to LXME Home</button></div>
    <//>`;
  }

  const CM = { overview: Overview, goal: Goal, amount: Amount, period: Period, lock: Lock, review: Review, confirm: Confirm, dashboard: Dashboard, release: Release };
  const TABS = [["home", "Home"], ["snapshot", "Snapshot"], ["commit", "Commitment"], ["coach", "Coach"]];
  const View = s.tab === "home" ? Home : s.tab === "snapshot" ? Snapshot : s.tab === "coach" ? Coach : CM[s.cm];
  const TabBar = () => html`<nav class="ftabs" aria-label="Money tools (proposed)">${TABS.map(([k, l]) => html`<button key=${k} id=${"ft-" + k} aria-current=${s.tab === k ? "page" : undefined} onClick=${() => goTab(k)}>${l}</button>`)}</nav>`;
  const ex = periodInfo("1y");
  return html`<div class="stage">
    <main class="phone" aria-label="Prototype">
      ${s.tab !== "home" ? html`<${ConceptBar} /><${TabBar} />` : ""}
      <${View} />
    </main>
    <aside class="rail">
      <div class="eyebrow">LXME case study · clickable concept</div>
      <h1>Three tools, opened from LXME Home</h1>
      <p>Money Snapshot, Commitment Mode and Weekly Money Coach are separate tabs. Open any of them, in any order. Switching keeps your progress. Starts from a real LXME screenshot; everything else is proposed, and no money moves.</p>
      <ol>${TABS.map(([k, l], i) => html`<li key=${k}><button id=${"rail-" + k} class=${s.tab === k ? "on" : ""} onClick=${() => goTab(k)}><span class="d">${i === 0 ? "⌂" : i}</span>${k === "home" ? "LXME Home (real screen)" : k === "snapshot" ? "Money Snapshot" : k === "commit" ? "Commitment Mode" : "Weekly Money Coach"}</button></li>`)}</ol>
      <button class="btn-link" id="reset" onClick=${() => setS(INITIAL)}>Reset demo</button>
      <div class="legend">
        <span><b>Default example:</b> ₹25,000 one time toward a ₹60,000 future purchase (41.7% by amount invested), locked for 1 year: ${dfmt(START)} → ${dfmt(ex.end)} (${ex.days} days).</span>
        <span>Week ${WEEK} = day 84 → 281 days left · 84 ÷ 365 = 23% through the lock.</span>
        <span>Saved, invested and locked are three separate events. The lock is simulated: a real one needs an eligible product, partner, regulatory and technical validation.</span>
      </div>
    </aside>
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
